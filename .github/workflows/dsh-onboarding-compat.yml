name: DeepSeek Harness from-zero onboarding

on:
  workflow_dispatch:

concurrency:
  group: dsh-onboarding-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/dsh-compat-ci.mjs
        env:
          CROSSCHAT_LIVE: '1'
          DSH_COMPAT_SUITE: onboarding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-onboarding-win32-x64
          path: dsh-onboarding-evidence/
          if-no-files-found: warn
          retention-days: 21

  report:
    needs: probe
    if: always() && !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-onboarding-win32-x64
          path: evidence
      - uses: actions/github-script@v7
        with:
          script: |
            core.notice('Onboarding report verification is being implemented; no issue created.');
