name: macOS lifecycle reproduction

on:
  push:
    branches: [codex/fix-macos-ci]

jobs:
  reproduce:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Reproduce the two star connection failures
        env:
          CC_DBG: '1'
        run: npx vitest run --dir test test/session-star.test.ts test/revocation-pause.test.ts -t '多星：--connect|stops one launcher supervisor'
      - name: Sample the owned process group after timeout
        if: always()
        shell: bash
        run: |
          failed=0
          for attempt in 1 2 3 4 5; do
            echo "Owned stop timeout attempt ${attempt}"
            npx vitest run --dir test test/local-service-owned-stop.test.ts -t 'bounds a nonresponding stop job' || failed=1
          done
          exit "$failed"
